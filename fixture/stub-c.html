<!doctype html>
<!--
  Fixture C for the parity self-test: every job works, through the harder paths (known answers in
  fixture/stub-c-expected.json, 11 HAVE):
  J2 scripts autosave and are picked from a dropdown; J4 changing the speed pauses the text until play is pressed again;
  J6 text size is set in the editor only; J7 mirror is a dropdown; J8 the countdown is a checkbox that starts off;
  J9/J10 a "Record" tab opens a panel with "Start recording", a scroll "Stop" button comes before "Stop recording",
  and the file downloads by itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stub prompter C</title>
<style>
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #fff; color: #111; }
  #editor { padding: 20px; display: grid; gap: 10px; max-width: 760px; }
  textarea { height: 240px; }
  #prompter { position: fixed; inset: 0; background: #000; color: #f5f5f5; display: none; overflow: hidden; }
  #scroller { position: absolute; inset: 0; overflow: hidden; }
  #text { padding: 50vh 12% 100vh; line-height: 1.3; white-space: pre-wrap; }
  #bar { position: absolute; bottom: 0; left: 0; right: 0; background: #222; padding: 8px; display: flex; gap: 8px; }
  #count { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 120px; display: none; }
  #recpanel { display: none; position: absolute; right: 8px; bottom: 56px; background: #333; padding: 10px; }
  video { width: 160px; }
</style>
</head>
<body>
<div id="editor">
  <label>Script <select id="pick"></select></label>
  <button id="add">+ Add</button>
  <label>Title <input id="title" type="text"></label>
  <textarea id="body"></textarea>
  <label>Text size <input id="size" type="range" min="24" max="96" step="4" value="40"></label>
  <label>Mirror <select id="mirror"><option>Off</option><option>On</option></select></label>
  <label><input id="cd" type="checkbox"> 3-2-1 countdown</label>
  <button id="go">Start</button>
</div>
<div id="prompter">
  <div id="scroller"><div id="text"></div></div>
  <div id="count"></div>
  <div id="recpanel"><video id="cam" muted playsinline></video><button id="recbtn">&#9679; Start recording</button></div>
  <div id="bar">
    <button id="exit">Exit</button>
    <button id="pause">Stop</button>
    <button id="play">Play</button>
    <label>Speed <input id="speed" type="range" min="40" max="400" step="10" value="120"></label>
    <button id="rectab" role="tab">Record</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'stubC';
  let st = { list: [{ t: 'Toast', b: 'Warm the pan. Toast the bread.' }], cur: 0 };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.list) st = s; } catch (e) {}
  const save = () => localStorage.setItem(KEY, JSON.stringify(st));
  function fill() {
    $('pick').innerHTML = '';
    st.list.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.t || 'Untitled'; $('pick').appendChild(o); });
    $('pick').value = st.cur; $('title').value = st.list[st.cur].t; $('body').value = st.list[st.cur].b;
  }
  fill();
  $('pick').onchange = () => { st.cur = +$('pick').value; fill(); save(); };
  $('add').onclick = () => { st.list.push({ t: '', b: '' }); st.cur = st.list.length - 1; fill(); save(); };
  $('title').oninput = () => { st.list[st.cur].t = $('title').value; save(); $('pick').options[st.cur].textContent = $('title').value; };
  $('body').oninput = () => { st.list[st.cur].b = $('body').value; save(); };

  let running = false, last = 0;
  const sc = $('scroller');
  let acc = 0;
  function frame(t) {
    const dt = last ? (t - last) / 1000 : 0; last = t;
    if (running) { acc += (+$('speed').value) * 0.5 * dt; sc.scrollTop = acc; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function begin() {
    if (!$('cd').checked) { running = true; return; }
    let n = 3; $('count').style.display = 'block'; $('count').textContent = n;
    const iv = setInterval(() => { n--; if (n) $('count').textContent = n; else { clearInterval(iv); $('count').style.display = 'none'; running = true; } }, 1000);
  }
  $('go').onclick = () => {
    $('text').textContent = $('body').value;
    $('text').style.fontSize = $('size').value + 'px';
    $('text').style.transform = $('mirror').value === 'On' ? 'scaleX(-1)' : '';
    $('editor').style.display = 'none'; $('prompter').style.display = 'block';
    acc = 0; sc.scrollTop = 0; running = false; begin();
  };
  $('exit').onclick = () => { running = false; $('prompter').style.display = 'none'; $('editor').style.display = 'grid'; };
  $('pause').onclick = () => { running = false; };
  $('play').onclick = () => { running = true; };
  $('speed').oninput = () => { running = false; };   // a speed change pauses until play is pressed again
  document.addEventListener('keydown', (e) => { if ($('prompter').style.display === 'block' && e.code === 'Space') { e.preventDefault(); running = !running; } });

  $('rectab').onclick = () => { $('recpanel').style.display = 'block'; };
  let rec = null, stream = null;
  $('recbtn').onclick = async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    stream = stream || await navigator.mediaDevices.getUserMedia({ video: { width: 960, height: 540 }, audio: true });
    $('cam').srcObject = stream; $('cam').play();
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => { $('recbtn').innerHTML = '&#9679; Start recording'; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'prompter-take.webm'; document.body.appendChild(a); a.click(); a.remove(); };
    rec.start(1000);
    $('recbtn').innerHTML = '&#9632; Stop recording';
  };
</script>
</body>
</html>
